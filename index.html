<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HORINTATI SPORTS CLUB</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#eef3f8;
    color:#17202a;
}

header{
    background:linear-gradient(135deg,#063b22,#0b7a43);
    color:white;
    text-align:center;
    padding:25px 10px;
}

header h1{
    font-size:28px;
    margin-bottom:7px;
}

header p{
    font-size:14px;
    opacity:.9;
}

.container{
    width:95%;
    max-width:1100px;
    margin:20px auto;
}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
}

.menu button{
    border:none;
    padding:15px 8px;
    border-radius:10px;
    background:#087f46;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.menu button:hover{
    background:#055c32;
}

.section{
    display:none;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.section.active{
    display:block;
}

.section h2{
    color:#087f46;
    margin-bottom:18px;
    text-align:center;
}

.card{
    background:#f7f9fa;
    border:1px solid #dfe5e8;
    border-radius:12px;
    padding:15px;
    margin:12px 0;
}

.notice-card h3{
    color:#087f46;
    margin-bottom:8px;
}

.notice-date{
    font-size:12px;
    color:#777;
    margin-top:10px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin:7px 0 12px;
    border:1px solid #ccd3d8;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.primary-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#087f46;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.primary-btn:hover{
    background:#055c32;
}

.danger-btn{
    background:#c62828;
}

.small-btn{
    padding:9px 12px;
    border:none;
    border-radius:7px;
    color:white;
    background:#087f46;
    cursor:pointer;
}

.member-profile{
    text-align:center;
    max-width:450px;
    margin:0 auto;
}

.member-profile img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid #087f46;
    margin-bottom:15px;
}

.member-info{
    text-align:left;
}

.member-info div{
    background:#f1f5f3;
    padding:12px;
    margin:7px 0;
    border-radius:8px;
}

.member-info strong{
    color:#087f46;
}

.player-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.player-card{
    text-align:center;
    background:#f7f9fa;
    border:1px solid #dfe5e8;
    border-radius:12px;
    padding:15px;
}

.player-card img{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #087f46;
    margin-bottom:10px;
}

.player-card h3{
    color:#087f46;
    margin-bottom:5px;
}

.admin-panel{
    display:none;
}

.admin-box{
    border:1px solid #dce2e5;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

.admin-box h3{
    color:#087f46;
    margin-bottom:12px;
}

.preview-img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:10px;
    display:none;
    margin:5px 0 12px;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px 10px;
}

.logout{
    margin-top:10px;
}

.status{
    text-align:center;
    margin:10px 0;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
    font-size:13px;
}

@media(max-width:700px){
    .menu{
        grid-template-columns:repeat(2,1fr);
    }

    header h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>⚽ HORINTATI SPORTS CLUB</h1>

</header>

<div class="container">

            <div class="admin-box">

                <input

</div>

/* ==========================================

========================================== */

const ADMIN_PASSWORD = "@#$@#$@#$";


/* ==========================================
   SECTION NAVIGATION
========================================== */

window.showSection = function(sectionId){

    document
        .querySelectorAll(".section")
        .forEach(section => {

            section.classList.remove("active");

        });

    document
        .getElementById(sectionId)
        .classList.add("active");

};


/* ==========================================
   ADMIN LOGIN
========================================== */

window.adminLogin = function(){

    const pass =
        document.getElementById("admin-pass").value;

    const message =
        document.getElementById("admin-message");


    if(pass === ADMIN_PASSWORD){

        message.style.color = "green";
        message.textContent =
            "Admin Login Successful!";

        document.getElementById("admin-panel")
            .style.display = "block";

        document.getElementById("admin-pass")
            .value = "";

    }

    else{

        message.style.color = "red";
        message.textContent =
            "Wrong Admin Password!";

    }

};


/* ==========================================
   ADMIN LOGOUT
========================================== */

window.adminLogout = function(){

    document.getElementById("admin-panel")
        .style.display = "none";

    document.getElementById("admin-message")
        .textContent = "";

    alert("Admin Logout Successful!");

};


/* ==========================================
   IMAGE TO BASE64
========================================== */

function imageToBase64(file){

    return new Promise((resolve,reject)=>{

        const reader = new FileReader();

        reader.onload = () => {

            resolve(reader.result);

        };

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}


/* ==========================================
   IMAGE PREVIEW
========================================== */

window.previewMemberImage = function(event){

    const file =
        event.target.files[0];

    const preview =
        document.getElementById(
            "member-pic-preview"
        );


    if(file){

        preview.src =
            URL.createObjectURL(file);

        preview.style.display = "block";

    }

};


/* ==========================================
   ADD NOTICE
========================================== */

window.addNotice = async function(){

    const title =
        document.getElementById(
            "notice-title"
        ).value.trim();

    const desc =
        document.getElementById(
            "notice-desc"
        ).value.trim();


    if(!title || !desc){

        alert("সব ঘর পূরণ করুন!");

        return;

    }


    try{

        await push(
            ref(db,"notices"),
            {

                title: title,

                desc: desc,

                date:
                    new Date()
                    .toLocaleString("bn-BD")

            }
        );


        alert(
            "নোটিশ সফলভাবে প্রকাশ হয়েছে!"
        );


        document.getElementById(
            "notice-title"
        ).value = "";


        document.getElementById(
            "notice-desc"
        ).value = "";


    }

    catch(error){

        console.error(error);

        alert(
            "নোটিশ যোগ করা যায়নি। Firebase Rules পরীক্ষা করুন।"
        );

    }

};


/* ==========================================
   ADD MEMBER
========================================== */

window.addMember = async function(){

    const imageFile =
        document.getElementById(
            "member-pic"
        ).files[0];


    const name =
        document.getElementById(
            "member-name"
        ).value.trim();


    const jersey =
        document.getElementById(
            "member-jersey"
        ).value.trim();


    const position =
        document.getElementById(
            "member-position"
        ).value.trim();


    const memberNo =
        document.getElementById(
            "member-no"
        ).value.trim();


    const password =
        document.getElementById(
            "member-password"
        ).value;


    if(
        !imageFile ||
        !name ||
        !jersey ||
        !position ||
        !memberNo ||
        !password
    ){

        alert(
            "সব তথ্য এবং Member Picture দিন!"
        );

        return;

    }


    try{

        const imageData =
            await imageToBase64(imageFile);


        /*
         * Member data
         */

        const memberRef =
            push(ref(db,"members"));


        await set(
            memberRef,
            {

                name: name,

                jersey: jersey,

                position: position,

                memberNo: memberNo,

                password: password,

                photo: imageData,

                createdAt:
                    Date.now()

            }
        );


        /*
         * একই member-কে Player List-এও রাখা হচ্ছে।
         *
         * Player List-এ password রাখা হচ্ছে না।
         */

        const playerRef =
            push(ref(db,"players"));


        await set(
            playerRef,
            {

                name: name,

                jersey: jersey,

                position: position,

                memberNo: memberNo,

                photo: imageData,

                createdAt:
                    Date.now()

            }
        );


        alert(
            "Member সফলভাবে যোগ হয়েছে!"
        );


        clearMemberForm();

    }

    catch(error){

        console.error(error);

        alert(
            "Member যোগ করা যায়নি। Firebase Rules/Database পরীক্ষা করুন।"
        );

    }

};


/* ==========================================
   CLEAR MEMBER FORM
========================================== */

function clearMemberForm(){

    document.getElementById(
        "member-pic"
    ).value = "";


    document.getElementById(
        "member-name"
    ).value = "";


    document.getElementById(
        "member-jersey"
    ).value = "";


    document.getElementById(
        "member-position"
    ).value = "";


    document.getElementById(
        "member-no"
    ).value = "";


    document.getElementById(
        "member-password"
    ).value = "";


    document.getElementById(
        "member-pic-preview"
    ).style.display = "none";

}


/* ==========================================
   MEMBER LOGIN
========================================== */

window.memberLogin = function(){

    const memberNo =
        document.getElementById(
            "member-login-no"
        ).value.trim();


    const password =
        document.getElementById(
            "member-login-password"
        ).value;


    const message =
        document.getElementById(
            "member-login-message"
        );


    if(!memberNo || !password){

        message.style.color = "red";

        message.textContent =
            "Member No এবং Password দিন।";

        return;

    }


    onValue(
        ref(db,"members"),
        (snapshot)=>{

            const data =
                snapshot.val();


            let found = null;


            if(data){

                Object.values(data)
                    .forEach(member => {

                        if(
                            String(member.memberNo)
                            === String(memberNo)
                            &&
                            String(member.password)
                            === String(password)
                        ){

                            found = member;

                        }

                    });

            }


            if(found){

                message.style.color =
                    "green";

                message.textContent =
                    "Login Successful!";


                showMemberProfile(found);

            }

            else{

                message.style.color =
                    "red";

                message.textContent =
                    "Member No অথবা Password ভুল।";

                document.getElementById(
                    "member-profile-area"
                ).innerHTML = "";

            }

        },
        {
            onlyOnce:true
        }
    );

};


/* ==========================================
   SHOW MEMBER PROFILE
========================================== */

function showMemberProfile(member){

    const area =
        document.getElementById(
            "member-profile-area"
        );


    area.innerHTML = `

        <div class="card member-profile">

            <img
                src="${member.photo}"
                alt="Member Photo"
            >

            <h2>
                ${escapeHTML(member.name)}
            </h2>

            <div class="member-info">

                <div>
                    <strong>MEMBER NAME:</strong>
                    ${escapeHTML(member.name)}
                </div>

                <div>
                    <strong>JERSY NUMBER:</strong>
                    ${escapeHTML(member.jersey)}
                </div>

                <div>
                    <strong>POSITION:</strong>
                    ${escapeHTML(member.position)}
                </div>

                <div>
                    <strong>MEMBER NO:</strong>
                    ${escapeHTML(member.memberNo)}
                </div>

            </div>

        </div>

    `;

}
