.player{

.status{

.admin-member{

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    onValue,
    remove
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBZJ-YFM3ur-Vh-YIW59wRQCAfTLHufb94",

    authDomain:
    "horintati-sports-club-9e801.firebaseapp.com",

    databaseURL:
    "https://horintati-sports-club-9e801-default-rtdb.firebaseio.com",

    projectId:
    "horintati-sports-club-9e801",

    storageBucket:
    "horintati-sports-club-9e801.firebasestorage.app",

    messagingSenderId:
    "581611297580",

    appId:
    "1:581611297580:web:04ff0e6994e1f62483ea89"
};


const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);


/* =====================================================
   ADMIN
===================================================== */

const ADMIN_PASSWORD =
"@#$@#$@#$";

let isAdmin = false;


/* =====================================================
   PAGE
===================================================== */

window.openPage = function(id){

    document
    .querySelectorAll(".page")
    .forEach(page=>{
        page.classList.remove("active");
    });

    document
    .getElementById(id)
    .classList.add("active");

};


/* =====================================================
   ADMIN LOGIN
===================================================== */

window.adminLogin = function(){

    const password =
    document
    .getElementById("adminPassword")
    .value;

    const status =
    document
    .getElementById("adminStatus");


    if(password === ADMIN_PASSWORD){

        isAdmin = true;

        status.style.color =
        "green";

        status.textContent =
        "✅ Admin Login Successful!";


        document
        .getElementById("adminPanel")
        .style.display =
        "block";


        document
        .getElementById("adminPassword")
        .value = "";

    }

    else{

        status.style.color =
        "red";

        status.textContent =
        "❌ Wrong Admin Password!";

    }

};


/* =====================================================
   ADMIN LOGOUT
===================================================== */

window.adminLogout = function(){

    isAdmin = false;

    document
    .getElementById("adminPanel")
    .style.display =
    "none";

    document
    .getElementById("adminStatus")
    .textContent = "";

    alert("Admin Logout Successful!");

};


/* =====================================================
   IMAGE PREVIEW
===================================================== */

window.previewImage = function(event){

    const file =
    event.target.files[0];

    const preview =
    document.getElementById("imagePreview");


    if(file){

        preview.src =
        URL.createObjectURL(file);

        preview.style.display =
        "block";

    }

};


/* =====================================================
   IMAGE TO BASE64
===================================================== */

function imageToBase64(file){

    return new Promise(
    (resolve,reject)=>{

        const reader =
        new FileReader();

        reader.onload =
        ()=>{
            resolve(reader.result);
        };

        reader.onerror =
        reject;

        reader.readAsDataURL(file);

    });

}


/* =====================================================
   ADD NOTICE
===================================================== */

window.addNotice = async function(){

    if(!isAdmin){

        alert("আগে Admin Login করুন!");

        return;

    }


    const title =
    document
    .getElementById("noticeTitle")
    .value.trim();


    const description =
    document
    .getElementById("noticeDescription")
    .value.trim();


    if(!title || !description){

        alert(
        "Notice Title এবং Details দিন!"
        );

        return;

    }


    try{

        await push(
            ref(db,"notices"),
            {

                title:title,

                description:description,

                date:
                new Date()
                .toLocaleString("bn-BD"),

                createdAt:
                Date.now()

            }
        );


        document
        .getElementById("noticeTitle")
        .value = "";


        document
        .getElementById("noticeDescription")
        .value = "";


        alert(
        "✅ Notice Firebase-এ Save হয়েছে!"
        );

    }

    catch(error){

        console.error(error);

        alert(
        "❌ Firebase-এ Notice Save হয়নি। Database Rules পরীক্ষা করুন।"
        );

    }

};


/* =====================================================
   ADD MEMBER
===================================================== */

window.addMember = async function(){

    if(!isAdmin){

        alert("আগে Admin Login করুন!");

        return;

    }


    const file =
    document
    .getElementById("memberPicture")
    .files[0];


    const name =
    document
    .getElementById("memberName")
    .value.trim();


    const jersey =
    document
    .getElementById("memberJersey")
    .value.trim();


    const position =
    document
    .getElementById("memberPosition")
    .value.trim();


    const memberNo =
    document
    .getElementById("memberNo")
    .value.trim();


    const address =
    document
    .getElementById("memberAddress")
    .value.trim();


    const password =
    document
    .getElementById("memberPassword")
    .value;


    if(
        !file ||
        !name ||
        !jersey ||
        !position ||
        !memberNo ||
        !address ||
        !password
    ){

        alert(
        "সব তথ্য পূরণ করুন এবং ছবি নির্বাচন করুন!"
        );

        return;

    }


    try{

        const image =
        await imageToBase64(file);


        await push(
            ref(db,"members"),
            {

                photo:image,

                name:name,

                jersey:jersey,

                position:position,

                memberNo:memberNo,

                address:address,

                password:password,

                createdAt:
                Date.now()

            }
        );


        /*
         * Public Player List
         * এখানে password রাখা হচ্ছে না।
         */

        await push(
            ref(db,"players"),
            {

                photo:image,

                name:name,

                jersey:jersey,

                position:position,

                memberNo:memberNo,

                createdAt:
                Date.now()

            }
        );


        clearMemberForm();


        alert(
        "✅ Member Firebase-এ Successfully Save হয়েছে!"
        );

    }

    catch(error){

        console.error(error);

        alert(
        "❌ Member Save হয়নি। Firebase Database Rules পরীক্ষা করুন।"
        );

    }

};


/* =====================================================
   CLEAR MEMBER FORM
===================================================== */

function clearMemberForm(){

    document
    .getElementById("memberPicture")
    .value = "";

    document
    .getElementById("memberName")
    .value = "";

    document
    .getElementById("memberJersey")
    .value = "";

    document
    .getElementById("memberPosition")
    .value = "";

    document
    .getElementById("memberNo")
    .value = "";

    document
    .getElementById("memberAddress")
    .value = "";

    document
    .getElementById("memberPassword")
    .value = "";

    document
    .getElementById("imagePreview")
    .style.display = "none";

}


/* =====================================================
   MEMBER LOGIN
===================================================== */

window.memberLogin = function(){

    const memberNo =
    document
    .getElementById("memberLoginNo")
    .value.trim();


    const password =
    document
    .getElementById("memberLoginPassword")
    .value;


    const status =
    document
    .getElementById("memberStatus");


    if(!memberNo || !password){

        status.style.color =
        "red";

        status.textContent =
        "Member No এবং Password দিন।";

        return;

    }


    onValue(
        ref(db,"members"),
        snapshot=>{

            const data =
            snapshot.val();


            let found = null;


            if(data){

                Object.values(data)
                .forEach(member=>{

                    if(
                        String(member.memberNo)
                        === String(memberNo)
                        &&
                        String(member.password)
                        === String(password)
                    ){

                        found = member;

                    }

                });

            }


            if(found){

                status.style.color =
                "green";

                status.textContent =
                "✅ Member Login Successful!";


                document
                .getElementById("memberProfile")
                .innerHTML = `

                <div class="card member-profile">

                    <img
                    src="${safe(found.photo)}"
                    >

                    <h2 style="margin-top:15px">
                    ${safe(found.name)}
                    </h2>

                    <div class="info">

                        <div>
                        <b>MEMBER NAME:</b>
                        ${safe(found.name)}
                        </div>

                        <div>
                        <b>JERSEY NUMBER:</b>
                        ${safe(found.jersey)}
                        </div>

                        <div>
                        <b>POSITION:</b>
                        ${safe(found.position)}
                        </div>

                        <div>
                        <b>MEMBER NO:</b>
                        ${safe(found.memberNo)}
                        </div>

                        <div>
                        <b>ADDRESS:</b>
                        ${safe(found.address)}
                        </div>

                    </div>

                </div>
                `;

            }

            else{

                status.style.color =
                "red";

                status.textContent =
                "❌ Member No অথবা Password ভুল।";

                document
                .getElementById("memberProfile")
                .innerHTML = "";

            }

        },
        {
            onlyOnce:true
        }
    );

};


/* =====================================================
   LIVE NOTICE
===================================================== */

onValue(
    ref(db,"notices"),
    snapshot=>{

        const box =
        document
        .getElementById("noticeList");


        const data =
        snapshot.val();


        box.innerHTML = "";


        if(!data){

            box.innerHTML =
            `
            <div class="empty">
            এখনো কোনো Notice নেই।
            </div>
            `;

            return;

        }


        const items =
        Object.values(data).reverse();


        items.forEach(item=>{

            box.innerHTML +=
            `

            <div class="card">

                <div class="notice-title">
                📢 ${safe(item.title)}
                </div>

                <p style="margin-top:10px">
                ${safe(item.description)}
                </p>

                <div class="date">
                ${safe(item.date)}
                </div>

            </div>

            `;

        });

    }
);


/* =====================================================
   LIVE PLAYER LIST
===================================================== */

onValue(
    ref(db,"players"),
    snapshot=>{

        const box =
        document
        .getElementById("playerList");


        const data =
        snapshot.val();


        box.innerHTML = "";


        if(!data){

            box.innerHTML =
            `
            <div class="empty">
            এখনো কোনো Player নেই।
            </div>
            `;

            return;

        }


        Object.values(data)
        .reverse()
        .forEach(player=>{

            box.innerHTML +=
            `

            <div class="player">

                <img
                src="${safe(player.photo)}"
                >

                <h3>
                ⚽ ${safe(player.name)}
                </h3>

                <p>
                Jersey:
                ${safe(player.jersey)}
                </p>

                <p>
                Position:
                ${safe(player.position)}
                </p>

            </div>

            `;

        });

    }
);
